# ==============================================================================
# pyproject.toml 
# ==============================================================================

[build-system]
requires = [
  "scikit-build-core>=0.11.6",
  "pybind11>=2.11",
  "setuptools>=45",
  "wheel",
]
build-backend = "scikit_build_core.build"

[project]
name = "crispritz"
version = "3.0.0"
description = "CRISPRitz: High-Throughput and Variant-Aware In Silico Off-Target Sites Identification For CRISPR Genome Editing"
readme = "README.md"
authors = [
  {name = "Pinello Lab", email = "lpinello@mgh.harvard.edu"},
  {name = "InfOmics Lab", email = "rosalba.giugno@univr.it"}
]
maintainers = [
  {name = "Manuel Tognon", email = "manu.tognon@gmail.com"}
]
license = {text = "AGPL-3"}
keywords = ["CRISPR", "guide RNA", "off-target", "variant", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "mypy"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.scripts]
crispritz = "crispritz.__main__:main"

[project.urls]
Homepage = "https://github.com/pinellolab/CRISPRitz"
Documentation = "https://github.com/pinellolab/CRISPRitz"
Repository = "https://github.com/pinellolab/CRISPRitz"
"Bug Tracker" = "https://github.com/pinellolab/CRISPRitz/issues"
Changelog = "https://github.com/pinellolab/CRISPRitz/blob/main/CHANGELOG.md"

# ------------------------------------------------------------------------------
# src/ layout: tell setuptools where to find your Python package
# ------------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Keep dependencies in requirements.txt (as you had)
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# ------------------------------------------------------------------------------
# scikit-build-core configuration
# ------------------------------------------------------------------------------
[tool.scikit-build]
wheel.install-dir = "src/crispritz"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.19"
# cmake.args = ["-DBUILD_TESTING=ON"]
build.targets = ["_ternary_search_tree"] #, "test_nucleotide_encoding", "test_pam_search"]

# ------------------------------------------------------------------------------
# dev tooling
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["crispritz"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]

[tool.coverage.run]
source = ["src/crispritz"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError"
]
